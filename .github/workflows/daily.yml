name: 每日考情

on:
  schedule:
    # 北京时间每天 07:30（UTC 23:30）
    - cron: "30 23 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-kaoyan
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取并发布
        id: run
        shell: bash
        run: |
          set +e
          python crawl.py
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "退出码 $code"
          exit 0

      - name: 回写已抓链接
        if: steps.run.outputs.code == '0'
        shell: bash
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "kaoyan-bot"
            git config user.email "kaoyan-bot@users.noreply.github.com"
            git add data
            git commit -m "chore: 记录 $(date -u +%F) 已抓取条目"
            git push
          else
            echo "没有变化"
          fi

      - name: 没抓到新内容或抓取失败就开 issue
        if: steps.run.outputs.code != '0' && github.event_name != 'workflow_dispatch'
        uses: actions/github-script@v7
        env:
          CODE: ${{ steps.run.outputs.code }}
        with:
          script: |
            const code = process.env.CODE;
            const title = `每日考情自动更新异常（${new Date().toISOString().slice(0, 10)}）`;
            const why = code === "2" ? "五个来源都取不到 30 天内的新条目（可能站点改版或被限流）。" : `抓取脚本异常退出（码 ${code}）。`;
            const body = [
              why,
              "",
              `运行记录：${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              "",
              "排查建议：本机跑 `python crawl.py --dry`，看哪个源返回 0；对应改 `crawl.py` 里的解析函数。修好后 `workflow_dispatch` 手动跑一次。",
            ].join("\n");
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: "open",
            });
            const same = open.data.find((i) => i.title.startsWith("每日考情自动更新异常"));
            if (same) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: same.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body,
              });
            }
